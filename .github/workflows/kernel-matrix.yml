name: Kernel matrix (ABI conformance)

# Real-kernel Landlock conformance across a representative set of kernel versions,
# using Cilium little-vm-helper (LVH) prebuilt VM images. Each job boots one kernel,
# mounts the repo at /host, and runs the host-built tools/abi-conformance binary,
# asserting the expected ABI (where known) and that real enforcement / the
# unavailable paths behave.
#
# Kept OFF the hot push/PR path — slow, uses nested virtualization:
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    types: [labeled]

# ─────────────────────────────────────────────────────────────────────────────
# Tags are pinned to dated builds in quay.io/lvh-images/kind. NOTE: the
# little-vm-helper action only understands dated tags ("<ver>-YYYYMMDD.hhmmss") —
# the lvh binary strips "-main" when writing the qcow2 but the action does not, so
# "-main" tags fail with "unable to find local file ...". Dated tags also pin the
# build for reproducibility. Still to confirm from the first runs:
#  - Each image actually has Landlock in its active LSM stack. Every job prints
#    `/sys/kernel/security/lsm`; if a >=5.13 kernel reports abi=0, that image was
#    built without landlock in CONFIG_LSM and the row needs a different image.
#
# kernel -> Landlock ABI: 5.13=v1 5.19=v2 6.2=v3 6.7=v4 6.10=v5 6.12=v6 6.15=v7
#                         7.0=v8 7.1=v9. expect_abi is left "" (no assertion) where
# the LVH kernel's exact ABI isn't pinned; the binary still probes + runs the
# enforcement battery for whatever ABI it finds.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: read

jobs:
  conformance:
    if: github.event_name != 'pull_request' || github.event.label.name == 'kernel-matrix'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # image-versions confirmed present in quay.io/lvh-images/kind. Exact 6.7(v4)
        # and 6.10(v5) aren't published, but 6.12 (v6) cumulatively exercises the
        # network (v4) and ioctl (v5) rights, so the v4+ enforcement battery runs there.
        include:
          - { name: "no-landlock (5.4)",   image_version: "5.4-20260603.072225",      expect_abi: "0" }
          - { name: "v1 FS (5.15)",        image_version: "5.15-20260603.072225",     expect_abi: "1" }
          - { name: "v2 REFER (6.1)",      image_version: "6.1-20260603.072225",      expect_abi: "2" }
          - { name: "v3 TRUNCATE (6.6)",   image_version: "6.6-20260603.072225",      expect_abi: "3" }
          - { name: "v6 scope+net (6.12)", image_version: "6.12-20260603.072225",     expect_abi: "6" }
          - { name: "v7 logging (6.18)",   image_version: "6.18-20260603.072225",     expect_abi: "7" }
          - { name: "newest (bpf-next)",   image_version: "bpf-next-20260603.072225", expect_abi: ""  }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Odin (latest monthly release)
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build conformance binary (host)
        run: odin build tools/abi-conformance -out:abi-conformance

      - name: Run conformance under kernel ${{ matrix.image_version }}
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          image: kind
          image-version: ${{ matrix.image_version }}
          host-mount: ./
          install-dependencies: "true"
          cmd: |
            echo "uname: \$(uname -r)"
            echo "lsm: \$(cat /sys/kernel/security/lsm 2>/dev/null || echo '<none>')"
            echo "landlock-config:"; grep -i landlock /boot/config-\$(uname -r) 2>/dev/null || echo "  (config-\$(uname -r) absent or no LANDLOCK)"
            export LANDLOCK_EXPECT_ABI='${{ matrix.expect_abi }}'
            /host/abi-conformance
